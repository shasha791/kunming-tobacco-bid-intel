name: Daily Tobacco Bid Intelligence

# 云端每日采集与网站更新。北京时间 03:35 主任务 / 06:35 兜底（GitHub cron 为 UTC）。
# 目标：北京时间 08:00 前完成网页更新；不发送邮件/企微/飞书。
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "运行模式"
        type: choice
        required: true
        default: collect
        options:
          - collect
  schedule:
    - cron: "35 19 * * *"   # 北京时间 03:35（次日）
    - cron: "35 22 * * *"   # 北京时间 06:35（兜底）

concurrency:
  group: kunming-tobacco-bid-daily
  cancel-in-progress: false

jobs:
  collect-and-build:
    name: 采集、生成并构建网站
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      TZ: Asia/Shanghai
      NOTICE_DB_PATH: data/notices.sqlite
      CLOUD_SUMMARY_JSON: data/run-status.json
      CLOUD_RUN_JSON: cloud-output/latest-run.json
      TRIGGERED_SCHEDULE: ${{ github.event.schedule || '' }}
    steps:
      - name: 打印时间上下文
        shell: bash
        run: |
          echo "UTC: $(date -u '+%F %T')"
          echo "Asia/Shanghai: $(TZ=Asia/Shanghai date '+%F %T')"
          echo "触发: ${GITHUB_EVENT_NAME} / ${{ github.event.schedule || 'manual' }}"

      - name: 检出主分支
        uses: actions/checkout@v4
        with:
          ref: main

      - name: 设置 Node.js（内置 node:sqlite 需 22.5+）
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: 恢复历史状态（cloud-state 分支）
        id: restore
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p data cloud-output
          # 删除主分支工作区里遗留的本地数据库，禁止把它误当云端历史
          rm -f "$NOTICE_DB_PATH" data/run-status.json
          # 明确区分：分支不存在（首次） vs 检查失败（网络/权限，必须中止）
          set +e
          git ls-remote --exit-code --heads origin cloud-state >/dev/null 2>&1
          remote_rc=$?
          set -e
          if [ "$remote_rc" -eq 0 ]; then
            echo "RESTORE_MODE=restore" >> "$GITHUB_ENV"
            git fetch --depth=1 origin cloud-state
            # 数据库文件缺失必须中止，不得用空库覆盖历史
            if ! git cat-file -e origin/cloud-state:state/notices.sqlite 2>/dev/null; then
              echo "cloud-state 存在但缺少 state/notices.sqlite，拒绝静默初始化空库。"
              exit 1
            fi
            git show origin/cloud-state:state/notices.sqlite > "$NOTICE_DB_PATH"
            # 校验恢复出来的数据库完整性
            node -e "const {inspectDatabase}=require('./scripts/cloud-pipeline');const d=inspectDatabase(process.env.NOTICE_DB_PATH);if(!d.exists||d.integrity!=='ok'){throw new Error('restored database invalid: '+d.integrity)}"
            if git cat-file -e origin/cloud-state:state/run-status.json 2>/dev/null; then
              git show origin/cloud-state:state/run-status.json > data/run-status.json
            fi
            echo "历史状态恢复完成（notices.sqlite integrity ok）"
          elif [ "$remote_rc" -eq 2 ]; then
            echo "RESTORE_MODE=first-run" >> "$GITHUB_ENV"
            echo "cloud-state 分支不存在：首次运行，安全初始化空数据库。"
          else
            echo "cloud-state 远程检查失败（rc=$remote_rc），可能是网络或权限问题；不按首次运行处理，中止。"
            exit 1
          fi

      - name: 运行云端采集流水线
        id: pipeline
        continue-on-error: true   # 失败也必须产出运行摘要，供后续 job 保存真实失败状态
        shell: bash
        run: node scripts/cloud-pipeline.js

      - name: 记录采集步骤退出码
        shell: bash
        run: |
          echo "PIPELINE_OUTCOME=${{ steps.pipeline.outcome }}" >> "$GITHUB_ENV"
          echo "采集步骤结果: ${{ steps.pipeline.outcome }}（success/failure）"

      - name: 校验并收集运行产物
        id: collect_artifacts
        shell: bash
        run: |
          set -euo pipefail
          node scripts/prepare-artifacts.js

      - name: 上传状态交接
        uses: actions/upload-artifact@v4
        with:
          name: cloud-state-update
          path: cloud-output/
          retention-days: 2
          if-no-files-found: error

  save-and-publish:
    name: 保存状态并发布网站
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: collect-and-build
    # 采集 job 失败也要保存真实失败摘要；仅取消时不运行
    if: ${{ always() && needs.collect-and-build.result != 'cancelled' }}
    permissions:
      contents: write
    env:
      TZ: Asia/Shanghai
    steps:
      - name: 检出主分支
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 下载 artifact（官方 action）
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: cloud-state-update
          path: cloud-output

      - name: 校验交接内容
        id: handoff
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -s cloud-output/run-status.json ]; then
            echo "HANDOFF_OK=false" >> "$GITHUB_ENV"
            echo "SITE_READY=false" >> "$GITHUB_ENV"
            echo "无运行摘要交接，跳过保存与发布。"
          else
            echo "HANDOFF_OK=true" >> "$GITHUB_ENV"
            echo "运行摘要: $(node -e "const s=require('./cloud-output/run-status.json');console.log(s.status, s.runId)")"
            # 站点是否可发布以交接产物为准（job 间不共享 GITHUB_ENV）
            if [ -s cloud-output/site/index.html ] && [ -s cloud-output/site/data/app-data.js ]; then
              echo "SITE_READY=true" >> "$GITHUB_ENV"
            else
              echo "SITE_READY=false" >> "$GITHUB_ENV"
              echo "站点产物缺失或不完整，不发布。"
            fi
          fi

      - name: 保存运行摘要与数据库到 cloud-state 分支
        if: ${{ env.HANDOFF_OK == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git ls-remote --exit-code --heads origin cloud-state >/dev/null 2>&1; then
            git fetch origin cloud-state
            git checkout -B cloud-state origin/cloud-state
          else
            git checkout --orphan cloud-state
            git rm -rf . >/dev/null 2>&1 || true
          fi
          mkdir -p state
          # 运行摘要始终保存（失败也必须留痕）
          cp cloud-output/run-status.json state/run-status.json
          if [ -f cloud-output/latest-run.json ]; then cp cloud-output/latest-run.json state/latest-run.json; fi
          # 数据库仅在本轮产出有效时保存，否则保留 cloud-state 中历史数据库
          db_saved=false
          if [ -s cloud-output/notices.sqlite ]; then
            node -e "const {inspectDatabase}=require('./scripts/cloud-pipeline');const d=inspectDatabase('cloud-output/notices.sqlite');if(d.integrity!=='ok')process.exit(1)"
            cp cloud-output/notices.sqlite state/notices.sqlite
            db_saved=true
          fi
          git add -f state/run-status.json
          [ -f state/latest-run.json ] && git add -f state/latest-run.json
          if [ "$db_saved" = true ]; then git add -f state/notices.sqlite; fi
          git commit -m "Update cloud state $(date -u '+%F %T')" || echo "No state changes."
          git push origin cloud-state
          echo "数据库已保存: $db_saved（false 表示本轮未产出有效库，历史库未被动）"

      - name: 发布网站内容到 gh-pages 分支
        if: ${{ env.HANDOFF_OK == 'true' && env.SITE_READY == 'true' }}
        shell: bash
        env:
          PAGES_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # 先在完整工作区生成部署标记（切换分支并清理后 scripts/ 将不存在）
          node scripts/write-deploy-status.js
          cp data/deploy-status.js data/deploy-status.json cloud-output/site/data/
          # 再切换到部署分支：只发布 site 内容，删除的是 git 跟踪文件，不碰 cloud-output
          git checkout -B gh-pages-deploy
          git rm -rf . >/dev/null 2>&1 || true
          cp -r cloud-output/site/. .
          touch .nojekyll
          git add -A
          git commit -m "Publish site $(date -u '+%F %T')" || echo "No site changes."
          git push --force origin gh-pages-deploy:gh-pages

      - name: 汇总本轮结果
        if: ${{ always() }}
        shell: bash
        run: |
          echo "采集job: ${{ needs.collect-and-build.result }}"
          echo "保存/发布job结论见各步骤日志；部署标记由发布步骤生成。"
